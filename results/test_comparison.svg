<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">AccountLens final test comparison</title>
  <desc id="desc">Horizontal bars compare the rules baseline and final M2 model for accuracy, macro F1, and coverage.</desc>
  <rect width="1000" height="580" fill="#f8fafc"/>
  <text x="70" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">AccountLens · Final test comparison</text>
  <text x="70" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">20 synthetic accounts · 120 role labels · frozen configuration</text>

  <line x1="255" y1="125" x2="905" y2="125" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="255" y1="125" x2="255" y2="505" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="580" y1="125" x2="580" y2="505" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="905" y1="125" x2="905" y2="505" stroke="#e2e8f0" stroke-width="1"/>
  <text x="255" y="116" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">0.0</text>
  <text x="580" y="116" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">0.5</text>
  <text x="905" y="116" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">1.0</text>

  <text x="70" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#0f172a">Accuracy</text>
  <rect x="255" y="145" width="433.4" height="34" rx="6" fill="#94a3b8"/>
  <rect x="255" y="187" width="650" height="34" rx="6" fill="#2563eb"/>
  <text x="700" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">0.6667</text>
  <text x="895" y="210" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#ffffff">1.0000</text>

  <text x="70" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#0f172a">Macro-F1</text>
  <rect x="255" y="277" width="456.6" height="34" rx="6" fill="#94a3b8"/>
  <rect x="255" y="319" width="650" height="34" rx="6" fill="#2563eb"/>
  <text x="723" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">0.7024</text>
  <text x="895" y="342" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#ffffff">1.0000</text>

  <text x="70" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#0f172a">Coverage</text>
  <rect x="255" y="409" width="325" height="34" rx="6" fill="#94a3b8"/>
  <rect x="255" y="451" width="541.6" height="34" rx="6" fill="#2563eb"/>
  <text x="592" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">0.5000</text>
  <text x="786" y="474" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#ffffff">0.8333</text>

  <rect x="70" y="525" width="18" height="18" rx="4" fill="#94a3b8"/>
  <text x="98" y="539" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Rules baseline</text>
  <rect x="245" y="525" width="18" height="18" rx="4" fill="#2563eb"/>
  <text x="273" y="539" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Final M2</text>
  <text x="905" y="539" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Evidence precision 1.000 · Critical-event recall 1.000</text>
</svg>
